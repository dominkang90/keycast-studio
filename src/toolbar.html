<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>KeyCast — 녹화 중</title>
    <style>
      /* The recording bar: a graphite slab with a recessed tally light and raised keys, like a
         keyboard, kept shallow so it stays light. Two forms: the usual bar (520px) and a small one (220px: light, time, hide, stop).
         Only the bar's width is animated; the label and keys in the middle give way as it narrows.
         Nothing is drawn outside the window's 8px margin (a larger shadow shows as a square edge). */
      :root { --spring: cubic-bezier(0.32, 0.72, 0, 1); --morph: 420ms; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #ededed; user-select: none;
        font: 13px "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
      .bar { box-sizing: border-box; margin: 8px; width: 520px; height: 48px; border-radius: 14px; overflow: hidden;
        display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; -webkit-app-region: drag;
        background: linear-gradient(rgba(44, 44, 47, 0.94), rgba(36, 36, 39, 0.94)); border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 5px rgba(0, 0, 0, 0.28);
        transition: width var(--morph) var(--spring); animation: bar-in var(--morph) var(--spring) backwards; }
      .bar.mini { width: 220px; }
      .bar.instant, .bar.instant * { transition: none !important; animation: none !important; }
      @keyframes bar-in { from { width: 48px; opacity: 0.3; } }

      /* tally light: a lamp set into a small well, glowing through */
      .led { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #0d0d0e;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.07); }
      .led i { width: 10px; height: 10px; border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, rgba(255, 190, 182, 0.95), rgba(255, 69, 58, 0.88) 46%, rgba(255, 69, 58, 0.5));
        box-shadow: 0 0 7px 2px rgba(255, 69, 58, 0.5), inset 0 -1px 1.5px rgba(120, 10, 4, 0.5); animation: glow 1.8s ease-in-out infinite; }
      .paused .led i { background: radial-gradient(circle at 36% 30%, rgba(255, 236, 180, 0.95), rgba(227, 179, 65, 0.88) 46%, rgba(227, 179, 65, 0.5));
        box-shadow: 0 0 6px 1px rgba(227, 179, 65, 0.4), inset 0 -1px 1.5px rgba(110, 80, 0, 0.5); animation: none; }
      @keyframes glow { 50% { opacity: 0.45; box-shadow: 0 0 3px 0 rgba(255, 69, 58, 0.25), inset 0 -1px 1.5px rgba(120, 10, 4, 0.5); } }

      .time { flex: none; min-width: 52px; font: 500 17px/1 "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
      .extra { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; height: 100%;
        transition: opacity 200ms var(--spring) 120ms, margin var(--morph) var(--spring), visibility 0s; }
      .mini .extra { opacity: 0; margin-right: -8px; pointer-events: none; visibility: hidden; transition: opacity 140ms var(--spring), margin var(--morph) var(--spring), visibility 0s var(--morph); }
      .label { color: #a1a1a6; font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .keynote { color: #a1a1a6; }
      .keynote.off { color: #e3b341; font-weight: 600; }

      /* keys: raised caps that travel 2px when pressed; the symbol is cut into the cap */
      button { -webkit-app-region: no-drag; flex: none; box-sizing: border-box; height: 30px; margin-bottom: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.28); color: #e4e4e8; font: inherit; font-weight: 600; padding: 0 11px; cursor: pointer; overflow: hidden;
        background: linear-gradient(#4a4a4f, #424246);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 1px 0 rgba(0, 0, 0, 0.45);
        transition: transform 90ms ease-out, box-shadow 90ms ease-out, background-color 150ms, max-width var(--morph) var(--spring), padding var(--morph) var(--spring), margin var(--morph) var(--spring), opacity 200ms var(--spring); }
      button:hover { background: linear-gradient(#55555a, #4b4b50); }
      button:active:not(:disabled), button[aria-pressed="true"] { transform: translateY(1px); background: #333336;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45); }
      button:focus-visible { outline: 2px solid #5b9dff; outline-offset: 2px; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.icon-only { width: 32px; padding: 0; }
      svg { width: 16px; height: 16px; display: block; flex: none; filter: drop-shadow(0 -0.5px 0 rgba(0, 0, 0, 0.45)); }
      button.stop { color: #fff; border-color: rgba(60, 0, 0, 0.7); background: linear-gradient(#ff5b50, #e5352b);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 0 rgba(110, 15, 8, 0.8); }
      button.stop:hover { background: linear-gradient(#ff6a60, #ea3d33); }
      button.stop:active:not(:disabled) { background: #dc362c; box-shadow: inset 0 1px 2px rgba(90, 0, 0, 0.5); }
      #stop-text { max-width: 80px; white-space: nowrap; overflow: hidden; transition: max-width var(--morph) var(--spring), opacity 160ms var(--spring), margin var(--morph) var(--spring); }
      .mini #stop { padding: 0 7px; }
      .mini #stop-text { max-width: 0; opacity: 0; margin-left: -6px; }

      #keys { color: #8e8e93; }
      #keys[aria-pressed="true"] { color: #ededed; }
      #keys .slash { display: block; }
      #keys[aria-pressed="true"] .slash { display: none; }
      #keyrec .i-lock { display: none; }
      #keyrec[aria-pressed="true"] { color: #e3b341; }
      #keyrec[aria-pressed="true"] .i-lock { display: block; }
      #keyrec[aria-pressed="true"] .i-rec { display: none; }
      #pause .i-play { display: none; }
      #pause.is-paused .i-play { display: block; }
      #pause.is-paused .i-pause { display: none; }
      #mini .i-out { display: none; }
      .mini #mini .i-out { display: block; }
      .mini #mini .i-in { display: none; }
      @media (prefers-reduced-motion: reduce) { .bar, .bar * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="led"><i></i></div>
      <div class="time" id="time">0:00</div>
      <div class="extra" id="extra">
        <div class="label"><span id="label">녹화 중</span> <span class="keynote" id="keynote"></span></div>
        <button id="keys" class="icon-only" title="화면 키 표시 켜기/끄기 (Alt+Shift+K)" aria-label="화면 키 표시" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path class="slash" d="M4.5 3.5l15 17"/></svg>
        </button>
        <button id="keyrec" class="icon-only" aria-pressed="false" title="키 기록 멈춤 (Alt+Shift+L)" aria-label="키 기록 멈춤">
          <svg class="i-rec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10.2 10h.01M13.8 10h.01M17.5 10h.01M8 14h8"/></svg>
          <svg class="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
        <button id="pause" class="icon-only" title="일시정지 (Alt+Shift+P)" aria-label="일시정지">
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1L8.9 4.7a.6.6 0 0 0-.9.5z"/></svg>
        </button>
      </div>
      <button id="tray" class="icon-only" title="트레이로 숨기기" aria-label="트레이로 숨기기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9.5M8 9.5l4 4 4-4M5 19h14"/></svg>
      </button>
      <button id="mini" class="icon-only" title="작게 보기" aria-label="작게 보기">
        <svg class="i-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        <svg class="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="stop" class="stop" title="멈추고 편집 (Alt+Shift+S)">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg><span id="stop-text">멈춤</span>
      </button>
    </div>
    <script type="module" src="./toolbar.js"></script>
  </body>
</html>
