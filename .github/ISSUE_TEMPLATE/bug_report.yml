name: Bug report / 버그 신고
description: Something does not work as expected / 기대한 대로 동작하지 않을 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach recordings or screenshots that show passwords or private information.
        신고 고맙습니다. 비밀번호나 개인 정보가 보이는 녹화·캡처는 올리지 마세요.
  - type: textarea
    id: what
    attributes:
      label: What happened? / 무엇이 일어났나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 다시 일으키는 방법
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / 기대한 결과
  - type: input
    id: version
    attributes:
      label: KeyCast Studio version / 버전
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it? / 설치 방법
      options:
        - Installer (Setup.exe) / 설치 파일
        - Portable zip / 휴대용 zip
        - Browser version / 브라우저 버전
        - Built from source / 직접 빌드
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 버전
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Graphics card, monitors, display scale / 그래픽카드, 모니터 수, 화면 배율
      placeholder: NVIDIA RTX 3060, 2 monitors, 150 %
  - type: textarea
    id: extra
    attributes:
      label: Anything else (screenshots, the export settings used) / 그 밖에 (캡처, 내보내기 설정 등)