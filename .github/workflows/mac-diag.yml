# Diagnoses the macOS start-up crash (Trace/BPT trap, exit 133) and the signature: builds exactly
# like the release (npm run dist:mac), checks the signature and Gatekeeper's verdict, then starts
# the app many times in smoke-test mode and keeps every crash report. Runs on diag/* branches.
name: macOS start-up diagnosis

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build like the release
        run: npm run dist:mac
      - name: Signature and Gatekeeper
        run: |
          mkdir -p diag
          for a in arm64 x64; do
            app="release/dist/mac-$a/KeyCast Studio.app"
            echo "== $a" | tee -a diag/sign.txt
            codesign -dv --verbose=2 "$app" >> diag/sign.txt 2>&1 || true
            codesign --verify --deep --strict --verbose=2 "$app" >> diag/sign.txt 2>&1 && echo "verify OK" >> diag/sign.txt || echo "verify FAILED" >> diag/sign.txt
            xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$app"
            spctl --assess --type execute -vv "$app" >> diag/sign.txt 2>&1 || true
            xattr -d com.apple.quarantine "$app" || true
          done
          cat diag/sign.txt
      - name: Start it many times
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          app="release/dist/mac-arm64/KeyCast Studio.app/Contents/MacOS/KeyCast Studio"
          for i in $(seq 1 20); do
            rm -rf "$RUNNER_TEMP/p"; code=0
            KEYCAST_SMOKE="$PWD/diag/run-$i.json" "$app" --user-data-dir="$RUNNER_TEMP/p" > "diag/run-$i.log" 2>&1 || code=$?
            echo "run $i exit $code" | tee -a diag/summary.txt
            if [ "$code" != "0" ]; then sleep 8; fi
          done
          echo; awk '{print $4}' diag/summary.txt | sort | uniq -c
          cp ~/Library/Logs/DiagnosticReports/*.ips diag/ 2>/dev/null || true
          for f in diag/*.ips; do if [ -f "$f" ]; then echo "== $f"; head -c 8000 "$f"; echo; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-diag
          path: diag/
