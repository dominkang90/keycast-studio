<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="녹화 → 편집 → 내보내기">
<title>녹화 → 편집 → 내보내기</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Hiragino Sans','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{transform-box:view-box}

.dash{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.dot{animation:dot 3.6s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes dot{0%{transform:translateX(0);opacity:0}8%{opacity:1}45%{transform:translateX(450px);opacity:1}50%{transform:translateX(450px);opacity:1}92%{transform:translateX(900px);opacity:1}100%{transform:translateX(900px);opacity:0}}
.node{animation:node 3.6s infinite}
.n1{animation-delay:1.6s}.n2{animation-delay:3.3s}
@keyframes node{0%,100%{transform:scale(1)}6%{transform:scale(1.08)}14%{transform:scale(1)}}
.halo{animation:halo 3.6s ease-out infinite;opacity:0}
.h1{animation-delay:1.6s}.h2{animation-delay:3.3s}
@keyframes halo{0%{opacity:0.6;transform:scale(0.9)}25%,100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect width="1280" height="230" rx="22" fill="#19191b" stroke="rgba(255,255,255,0.08)"/>
<line class="dash" x1="240" y1="96" x2="1040" y2="96" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"/>
<circle class="dot" cx="190" cy="96" r="6" fill="#fff"/>
<g>
<circle class="halo h0" style="transform-origin:190px 96px" cx="190" cy="96" r="44" fill="none" stroke="#ff453a" stroke-width="2"/>
<g class="node n0" style="transform-origin:190px 96px"><circle cx="190" cy="96" r="44" fill="#232325" stroke="#ff453a" stroke-opacity="0.6" stroke-width="2"/>
<g transform="translate(190,96)"><circle r="13" fill="#ff453a"/><circle r="22" fill="none" stroke="#ff453a" stroke-width="2.5" opacity="0.5"/></g></g>
<text x="190" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#ededed">1. 녹화</text>
<text x="190" y="206" text-anchor="middle" font-size="15" fill="#a1a1a6">화면·마이크·웹캠·키</text>
</g>
<g>
<circle class="halo h1" style="transform-origin:640px 96px" cx="640" cy="96" r="44" fill="none" stroke="#5b9dff" stroke-width="2"/>
<g class="node n1" style="transform-origin:640px 96px"><circle cx="640" cy="96" r="44" fill="#232325" stroke="#5b9dff" stroke-opacity="0.6" stroke-width="2"/>
<g transform="translate(640,96)"><path d="M-14 12 L6 -8 L12 -2 L-8 18 L-16 20 Z" fill="#5b9dff"/><rect x="5" y="-20" width="9" height="12" rx="2" transform="rotate(45 9 -14)" fill="#5b9dff" opacity="0.7"/></g></g>
<text x="640" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#ededed">2. 편집</text>
<text x="640" y="206" text-anchor="middle" font-size="15" fill="#a1a1a6">확대·자르기·주석·자막</text>
</g>
<g>
<circle class="halo h2" style="transform-origin:1090px 96px" cx="1090" cy="96" r="44" fill="none" stroke="#4cc38a" stroke-width="2"/>
<g class="node n2" style="transform-origin:1090px 96px"><circle cx="1090" cy="96" r="44" fill="#232325" stroke="#4cc38a" stroke-opacity="0.6" stroke-width="2"/>
<g transform="translate(1090,96)"><path d="M0 -18 L0 8 M-10 -2 L0 8 L10 -2" fill="none" stroke="#4cc38a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16 14 L16 14" stroke="#4cc38a" stroke-width="4" stroke-linecap="round"/></g></g>
<text x="1090" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#ededed">3. 내보내기</text>
<text x="1090" y="206" text-anchor="middle" font-size="15" fill="#a1a1a6">MP4·WebM·GIF·SRT</text>
</g>
</svg>
