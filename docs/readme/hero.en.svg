<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="KeyCast Studio — Screen recordings that show every shortcut you press">
<title>KeyCast Studio — Screen recordings that show every shortcut you press</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Hiragino Sans','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{transform-box:view-box}

.blob{animation:drift 18s ease-in-out infinite alternate}
.b1{animation-duration:22s;animation-delay:-6s}.b2{animation-duration:26s;animation-delay:-11s}.b3{animation-duration:20s;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}100%{transform:translate(-30px,25px)}}
.zoom{transform-origin:1104px 324px;animation:zoom 8s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes zoom{0%,27%{transform:scale(1)}40%,64%{transform:scale(1.55)}80%,100%{transform:scale(1)}}
.cur{animation:cur 8s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes cur{0%{transform:translate(760px,416px)}20%,72%{transform:translate(1104px,324px)}90%,100%{transform:translate(760px,416px)}}
.press{transform-origin:1104px 324px;animation:press 8s infinite}
@keyframes press{0%,24%{transform:scale(1)}25.5%{transform:scale(0.78)}28%,100%{transform:scale(1)}}
.rip{transform-origin:1104px 324px;animation:rip 8s cubic-bezier(0.22,1,0.36,1) infinite;opacity:0}
.rip2{animation-delay:0.18s}
@keyframes rip{0%,24.9%{transform:scale(0.2);opacity:0}25%{transform:scale(0.2);opacity:0.95}34%,100%{transform:scale(1.6);opacity:0}}
.btn{animation:btn 8s infinite}
@keyframes btn{0%,24%{fill:#5b9dff}26%,60%{fill:#7db2ff}70%,100%{fill:#5b9dff}}
.bubble{transform-origin:930px 374px;animation:bubble 8s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes bubble{0%,25%{opacity:0;transform:translateY(14px) scale(0.86)}30%,70%{opacity:1;transform:translateY(0) scale(1)}76%,100%{opacity:0;transform:translateY(-6px) scale(0.96)}}
.subs{animation:subs 8s infinite}
@keyframes subs{0%,28%{opacity:0}31%,84%{opacity:1}88%,100%{opacity:0}}
.w{fill:#ffffff;animation:word 8s infinite}
.w0{animation-name:word0}@keyframes word0{0%,32%{fill:#ffffff}33%,100%{fill:#ffd33d}}
.w1{animation-name:word1}@keyframes word1{0%,41%{fill:#ffffff}42%,100%{fill:#ffd33d}}
.w2{animation-name:word2}@keyframes word2{0%,50%{fill:#ffffff}51%,100%{fill:#ffd33d}}
.w3{animation-name:word3}@keyframes word3{0%,59%{fill:#ffffff}60%,100%{fill:#ffd33d}}
.rec{animation:rec 1.6s ease-in-out infinite}
@keyframes rec{0%,100%{opacity:1}50%{opacity:0.35}}
.ring{transform-origin:84px 98px;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(0.6);opacity:0.7}100%{transform:scale(1.9);opacity:0}}
.in{animation:in 1s cubic-bezier(0.22,1,0.36,1) both}
.in1{animation-delay:0.1s}.in2{animation-delay:0.22s}.in3{animation-delay:0.34s}.in4{animation-delay:0.46s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.win{animation:win 1.2s cubic-bezier(0.22,1,0.36,1) 0.2s both}
@keyframes win{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:none}}
.scan{animation:scan 8s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(552px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect width="1280" height="560" rx="24" fill="#0f0f10"/>
<clipPath id="hc"><rect width="1280" height="560" rx="24"/></clipPath>
<g clip-path="url(#hc)">
<defs><filter id="hb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="67"/></filter></defs>
<g filter="url(#hb)" opacity="0.55"><circle class="blob b0" cx="153.6" cy="112" r="212.8" fill="#6d5efc"/><circle class="blob b1" cx="1088" cy="56" r="190.4" fill="#c254d8"/><circle class="blob b2" cx="960" cy="532" r="224" fill="#f7797d"/><circle class="blob b3" cx="384" cy="532" r="168" fill="#2b6bff"/></g>
<rect width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
</g>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,0.04)"/></pattern>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d8ff"/></linearGradient>
<clipPath id="wc"><rect x="640" y="126" width="580" height="340" rx="0"/></clipPath>
</defs>

<g class="in in0">
<circle class="ring" cx="84" cy="98" r="16" fill="none" stroke="#ff453a" stroke-width="3"/>
<circle cx="84" cy="98" r="18" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
<circle class="rec" cx="84" cy="98" r="9" fill="#ff453a"/>
<text x="116" y="107" font-size="26" font-weight="700" fill="#ededed">KeyCast <tspan fill="#a1a1a6" font-weight="400">Studio</tspan></text>
</g>
<g class="in in1"><text x="72" y="214" font-size="35.714285714285694" font-weight="750" fill="url(#tg)" letter-spacing="-0.5">Screen recordings that show</text></g>
<g class="in in2"><text x="72" y="259" font-size="35.714285714285694" font-weight="750" fill="url(#tg)" letter-spacing="-0.5">every shortcut you press</text></g>
<g class="in in3"><text x="72" y="326" font-size="20" fill="#a1a1a6">Key bubbles · zoom on clicks · subtitles from your voice</text></g>
<g class="in in4">
<rect x="72" y="372" width="163" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
<circle cx="89" cy="390" r="4" fill="#4cc38a"/>
<text x="100" y="396" font-size="15" fill="#ededed">Windows 10 / 11</text>
<rect x="245" y="372" width="188.79999999999998" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
<circle cx="262" cy="390" r="4" fill="#5b9dff"/>
<text x="273" y="396" font-size="15" fill="#ededed">Free &amp; open source</text>
<rect x="443.79999999999995" y="372" width="145.8" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
<circle cx="460.79999999999995" cy="390" r="4" fill="#ffd33d"/>
<text x="471.79999999999995" y="396" font-size="15" fill="#ededed">Works offline</text>
</g>

<g class="win">
<rect x="638" y="96" width="584" height="380" rx="16" fill="rgba(0,0,0,0.45)" filter="url(#hb)" opacity="0.6"/>
<rect x="640" y="86" width="580" height="380" rx="14" fill="#16171a" stroke="rgba(255,255,255,0.14)"/>
<circle cx="662" cy="106" r="6" fill="#ff5f57"/><circle cx="682" cy="106" r="6" fill="#febc2e"/><circle cx="702" cy="106" r="6" fill="#28c840"/>
<rect x="1110" y="96" width="92" height="20" rx="10" fill="rgba(255,69,58,0.16)"/>
<circle class="rec" cx="1124" cy="106" r="4.5" fill="#ff453a"/>
<text x="1136" y="111" font-size="12" fill="#ff8a82" class="mono">REC 0:08</text>
<line x1="640" y1="126" x2="1220" y2="126" stroke="rgba(255,255,255,0.08)"/>
<g clip-path="url(#wc)">
<g class="zoom">
<rect x="640" y="126" width="580" height="340" fill="#1b1c20"/>
<rect x="670" y="156" width="300" height="10" rx="5" fill="rgba(255,255,255,0.32)"/>
<rect x="670" y="182" width="240" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<rect x="670" y="208" width="330" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<rect x="670" y="234" width="200" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<rect x="670" y="260" width="280" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<rect x="670" y="286" width="160" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<rect x="670" y="322" width="320" height="70" rx="10" fill="rgba(91,157,255,0.10)" stroke="rgba(91,157,255,0.28)"/>
<rect x="686" y="340" width="180" height="10" rx="5" fill="rgba(255,255,255,0.22)"/>
<rect x="686" y="360" width="240" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
<g class="press"><rect class="btn" x="1044" y="302" width="120" height="44" rx="10" fill="#5b9dff"/>
<text x="1104" y="330" text-anchor="middle" font-size="17" font-weight="650" fill="#0b1220">Save</text></g>
<circle class="rip" cx="1104" cy="324" r="34" fill="rgba(255,211,61,0.25)" stroke="#ffd33d" stroke-width="3.5"/>
<circle class="rip rip2" cx="1104" cy="324" r="34" fill="none" stroke="#ffd33d" stroke-width="2"/>
<g class="cur"><g transform="scale(1.7)"><path d="M0 0 L0 17.2 L4.4 13.4 L7.3 20 L10 18.8 L7.1 12.4 L12.6 12.4 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></g></g>
</g>
</g>
<g class="bubble"><rect x="843.62" y="342" width="172.76" height="66" rx="14" fill="rgba(13,17,23,0.78)" stroke="rgba(255,255,255,0.08)"/>
<g transform="translate(857.62,354)"><g>
<rect x="0" y="3" width="78.76" height="41.8" rx="9.24" fill="#0a0b0d"/>
<rect x="0" y="0" width="78.76" height="41.8" rx="9.24" fill="#2f6fd6" stroke="rgba(255,255,255,0.10)"/>
<text x="39.38" y="28.82" text-anchor="middle" font-size="22" font-weight="650" fill="#ffffff" class="mono">Ctrl</text>
</g>
<text x="90.86000000000001" y="28.6" text-anchor="middle" font-size="19.8" fill="rgba(255,255,255,0.6)">+</text>
<g>
<rect x="102.96000000000001" y="3" width="41.8" height="41.8" rx="9.24" fill="#0a0b0d"/>
<rect x="102.96000000000001" y="0" width="41.8" height="41.8" rx="9.24" fill="#26292f" stroke="rgba(255,255,255,0.10)"/>
<text x="123.86000000000001" y="28.82" text-anchor="middle" font-size="22" font-weight="650" fill="#ffffff" class="mono">S</text>
</g></g></g>
<g class="subs"><rect x="760" y="414" width="340" height="34" rx="8" fill="rgba(0,0,0,0.72)"/>
<text x="930" y="437" text-anchor="middle" font-size="17" font-weight="650"><tspan class="w w0">Press</tspan> <tspan class="w w1">Ctrl+S</tspan> <tspan class="w w2">to</tspan> <tspan class="w w3">save</tspan></text></g>
<rect class="scan" x="654" y="462" width="14" height="2" rx="1" fill="#ff453a" opacity="0.8"/>
<rect x="654" y="462" width="552" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>
</g>
</svg>
