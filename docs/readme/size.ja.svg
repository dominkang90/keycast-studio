<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="v1.2 で軽くなったダウンロード">
<title>v1.2 で軽くなったダウンロード</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Hiragino Sans','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{transform-box:view-box}

.bar{transform-origin:220px 0;animation:grow 1.6s cubic-bezier(0.22,1,0.36,1) both}
.d1{animation-delay:0.25s}.d2{animation-delay:0.5s}.d3{animation-delay:0.75s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lab{animation:fade 0.8s ease both}
.l0{animation-delay:1.1s}.l1{animation-delay:1.35s}.l2{animation-delay:1.6s}.l3{animation-delay:1.85s}
@keyframes fade{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect width="1280" height="250" rx="22" fill="#19191b" stroke="rgba(255,255,255,0.08)"/>
<text x="40" y="48" font-size="22" font-weight="700" fill="#ededed">v1.2 で軽くなったダウンロード</text>
<g font-size="13" fill="#85858b"><rect x="1020" y="34" width="12" height="12" rx="3" fill="rgba(255,255,255,0.22)"/><text x="1038" y="45">v1.1</text>
<rect x="1100" y="34" width="12" height="12" rx="3" fill="#5b9dff"/><text x="1118" y="45">v1.2</text></g>
<text x="40" y="110" font-size="17" fill="#a1a1a6">インストーラー</text>
<rect class="bar d0" x="220" y="84" width="233.28571428571428" height="22" rx="6" fill="rgba(255,255,255,0.16)"/>
<text class="lab l0" x="465.2857142857143" y="101" font-size="15" fill="#85858b">142 MB</text>
<rect class="bar d1" x="220" y="112" width="175.78571428571428" height="22" rx="6" fill="#5b9dff"/>
<text class="lab l1" x="407.7857142857143" y="129" font-size="15" font-weight="700" fill="#ededed">107 MB  <tspan fill="#4cc38a">−25%</tspan></text>
<text x="40" y="190" font-size="17" fill="#a1a1a6">インストール後</text>
<rect class="bar d2" x="220" y="164" width="869.0714285714286" height="22" rx="6" fill="rgba(255,255,255,0.16)"/>
<text class="lab l2" x="1101.0714285714284" y="181" font-size="15" fill="#85858b">529 MB</text>
<rect class="bar d3" x="220" y="192" width="581.5714285714286" height="22" rx="6" fill="#5b9dff"/>
<text class="lab l3" x="813.5714285714286" y="209" font-size="15" font-weight="700" fill="#ededed">354 MB  <tspan fill="#4cc38a">−33%</tspan></text>
</svg>
