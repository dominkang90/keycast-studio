<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="What gets saved — Typed letters are dropped before saving. Shortcuts stay.">
<title>What gets saved — Typed letters are dropped before saving. Shortcuts stay.</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Hiragino Sans','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{transform-box:view-box}

.it{animation:move 8s linear infinite}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(1160px)}}
.typed{animation:typed 8s linear infinite}
@keyframes typed{0%,55.2%{opacity:1;transform:translateY(0)}60.3%,100%{opacity:0;transform:translateY(26px)}}
.gate{animation:gate 1.4s ease-in-out infinite alternate}
@keyframes gate{from{opacity:0.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect width="1280" height="210" rx="22" fill="#19191b" stroke="rgba(255,255,255,0.08)"/>
<clipPath id="pc"><rect x="20" y="60" width="1240" height="90"/></clipPath>
<text x="40" y="44" font-size="22" font-weight="700" fill="#ededed">What gets saved</text>
<text x="1240" y="44" text-anchor="end" font-size="15" fill="#a1a1a6">Typed letters are dropped before saving. Shortcuts stay.</text>
