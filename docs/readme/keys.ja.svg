<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" role="img" aria-label="ショートカットを画面に">
<title>ショートカットを画面に</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Hiragino Sans','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{transform-box:view-box}

.k{opacity:0;animation:k 7s cubic-bezier(0.22,1,0.36,1) infinite}
.k0{animation-delay:0s}.k1{animation-delay:0.9s}.k2{animation-delay:1.8s}
@keyframes k{0%{opacity:0;transform:translateY(18px) scale(0.9)}8%,60%{opacity:1;transform:none}70%,100%{opacity:0;transform:translateY(-10px)}}
.cnt{opacity:0;animation:cnt 7s infinite;animation-delay:0.9s}
@keyframes cnt{0%,10%{opacity:0}12%,58%{opacity:1}68%,100%{opacity:0}}
.t{animation:t 7s infinite}
.t0{animation-delay:2.8s}.t1{animation-delay:3.02s}.t2{animation-delay:3.2399999999999998s}.t3{animation-delay:3.46s}.t4{animation-delay:3.6799999999999997s}
@keyframes t{0%{opacity:0;transform:translateY(0)}2%{opacity:0.9}8%{opacity:0;transform:translateY(-26px)}100%{opacity:0}}
.drop{animation:drop 7s infinite;animation-delay:2.8s;opacity:0}
@keyframes drop{0%{opacity:0}3%,20%{opacity:1}26%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
